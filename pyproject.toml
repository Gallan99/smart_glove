[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-nanoparticle-smart-glove"
version = "1.0.0"
description = "Five-channel smart-glove acquisition and object-recognition pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyserial>=3.5,<4",
  "scikit-learn>=1.4,<2",
  "seaborn>=0.13,<1",
]

[project.scripts]
smart-glove-monitor = "software.live_monitor:main"
smart-glove-capture = "ml.capture_dataset:main"
smart-glove-train = "ml.train_rf:main"
smart-glove-infer = "ml.realtime_inference:main"

[tool.setuptools.packages.find]
include = ["software*", "ml*"]
